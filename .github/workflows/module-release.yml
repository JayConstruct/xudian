name: Publish immutable module release

on:
  workflow_dispatch:
  push:
    branches:
      - module-catalog
    paths:
      - .github/workflows/module-release.yml
      - scripts/module_catalog/release.py
      - scripts/module_catalog/test_release.py
    tags:
      - 'modules-*'

permissions:
  contents: write

concurrency:
  group: module-release-${{ github.ref_type == 'tag' && github.ref_name || 'modules-2026-10-08' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate prepared indexes and all 22 packages
        run: >-
          python3 scripts/module_catalog/catalog.py packages/catalog/catalog.json
          --index-dir module-index --package-dir dist/module-releases
      - name: Publish verified packages without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          MODULE_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'modules-2026-10-08' }}
          MODULE_RELEASE_REPOSITORY: ${{ github.repository }}
        run: >-
          python3 scripts/module_catalog/release.py
          --repository "$MODULE_RELEASE_REPOSITORY" --tag "$MODULE_RELEASE_TAG"
          --expected-count 22
