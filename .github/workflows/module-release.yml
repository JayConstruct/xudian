name: Publish immutable module release

on:
  push:
    tags:
      - 'modules-*'

permissions:
  contents: write

concurrency:
  group: module-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate prepared indexes and all 22 packages
        run: >-
          python3 scripts/module_catalog/catalog.py packages/catalog/catalog.json
          --index-dir module-index --package-dir dist/module-releases
      - name: Publish verified packages without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          MODULE_RELEASE_TAG: ${{ github.ref_name }}
          MODULE_RELEASE_REPOSITORY: ${{ github.repository }}
        run: >-
          python3 scripts/module_catalog/release.py
          --repository "$MODULE_RELEASE_REPOSITORY" --tag "$MODULE_RELEASE_TAG"
          --expected-count 22
