name: Publish immutable module release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable modules tag to publish
        required: true
        type: string
  push:
    tags:
      - 'modules-*'

permissions:
  contents: write

concurrency:
  group: module-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MODULE_RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      MODULE_RELEASE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          path: release-source
          persist-credentials: false
      - name: Check out tools for this workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locate current or historical prepared packages
        run: |
          echo "MODULE_RELEASE_DIR=$RUNNER_TEMP/module-release-assets" >> "$GITHUB_ENV"
          if [ -d release-source/releases/modules ]; then
            echo 'MODULE_PACKAGE_DIR=release-source/releases/modules' >> "$GITHUB_ENV"
          elif [ -d release-source/dist/module-releases ]; then
            echo 'MODULE_PACKAGE_DIR=release-source/dist/module-releases' >> "$GITHUB_ENV"
          else
            echo 'The selected tag contains no prepared module package directory.' >&2
            exit 1
          fi
      - name: Check repository boundaries where recorded by the source snapshot
        run: |
          if [ -f release-source/scripts/check_repository.py ]; then
            cd release-source
            python3 scripts/check_repository.py
          fi
      - name: Validate prepared indexes and packages
        run: >-
          python3 release-tools/scripts/module_catalog/catalog.py release-source/packages/catalog/catalog.json
          --index-dir release-source/module-index --package-dir "$MODULE_PACKAGE_DIR"
      - name: Select packages for this immutable release tag
        run: >-
          python3 release-tools/scripts/module_catalog/release.py
          --repository "$MODULE_RELEASE_REPOSITORY" --tag "$MODULE_RELEASE_TAG"
          --catalog release-source/packages/catalog/catalog.json --index-dir release-source/module-index
          --package-dir "$MODULE_PACKAGE_DIR" --stage-dir "$MODULE_RELEASE_DIR"
      - name: Publish verified packages without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 release-tools/scripts/module_catalog/release.py
          --repository "$MODULE_RELEASE_REPOSITORY" --tag "$MODULE_RELEASE_TAG"
          --catalog release-source/packages/catalog/catalog.json --index-dir release-source/module-index
          --package-dir "$MODULE_RELEASE_DIR"
          --title "序点模块：$MODULE_RELEASE_TAG"
          --notes "本 Release 提供当前 tag 的不可变模块包，源码与版本索引保存在同一 tag。安装前由客户端核验包身份、摘要、依赖、权限与签名状态。客户端 APK 由 Android Actions 工作流构建。"
