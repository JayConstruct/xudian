name: Android checks and release APKs

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflow configuration
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes=
          .github/workflows/*.yml packages/catalog/.github/workflows/*.yml
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install Android build toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        working-directory: client
        run: flutter pub get --enforce-lockfile
      - name: Validate app release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/validate_app_release.py "$RELEASE_TAG"
      - name: Check production architecture and Python tooling
        run: |
          python3 scripts/check_repository.py
          python3 scripts/module_host/check_architecture.py
          python3 -m unittest discover -s scripts/tests -v
          python3 -m unittest discover -s scripts/module_catalog -p 'test_*.py' -v
          python3 scripts/module_catalog/catalog.py packages/catalog/catalog.json --index-dir module-index --package-dir releases/modules
          python3 scripts/module_host/build_packages.py
      - name: Analyze Flutter client
        working-directory: client
        run: flutter analyze --no-pub
      - name: Check script result parity and bridge call counts
        run: node --experimental-vm-modules scripts/module_host/page_reads_performance_test.mjs
      - name: Run Flutter regression tests
        working-directory: client
        run: flutter test --no-pub --concurrency=2 --reporter expanded
      - name: Build release APKs for all supported Android ABIs
        working-directory: client
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: flutter build apk --release --split-per-abi --build-number="$((BUILD_NUMBER + 100))" --no-pub
      - name: Record APK checksums and source revision
        working-directory: client/build/app/outputs/flutter-apk
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          sha256sum *-release.apk > SHA256SUMS
          printf '%s\n' "$SOURCE_COMMIT" > SOURCE_COMMIT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xudian-android-${{ startsWith(github.ref, 'refs/tags/v') && 'candidate' || 'release' }}-${{ github.sha }}
          path: |
            client/build/app/outputs/flutter-apk/*-release.apk
            client/build/app/outputs/flutter-apk/SHA256SUMS
            client/build/app/outputs/flutter-apk/SOURCE_COMMIT
          if-no-files-found: error
          retention-days: 14

  sign:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: android-release
    permissions:
      contents: read
    steps:
      # This runner never checks out or executes application/build/test code.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: xudian-android-candidate-${{ github.sha }}
          path: candidate
      - name: Prepare signing tools and check candidate
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
          cd candidate
          test "$(cat SOURCE_COMMIT)" = "$GITHUB_SHA"
          sha256sum --check SHA256SUMS
          for abi in armeabi-v7a arm64-v8a x86_64; do
            test -f "app-$abi-release.apk"
          done
      - name: Sign and verify APKs
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set +x
          set -euo pipefail
          for credential in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPECTED_CERT_SHA256; do
            if [ -z "${!credential:-}" ]; then
              echo "Missing Android release signing setting: $credential" >&2
              exit 1
            fi
          done
          expected_cert=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [[ ! "$expected_cert" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'ANDROID_SIGNING_CERT_SHA256 must be a SHA-256 certificate fingerprint.' >&2
            exit 1
          fi
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/xudian-signing.XXXXXX")
          trap 'rm -rf -- "$signing_dir"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.jks"
          unset KEYSTORE_BASE64
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          mkdir signed
          for abi in armeabi-v7a arm64-v8a x86_64; do
            apk="app-$abi-release.apk"
            "$apksigner" sign --ks "$signing_dir/release.jks" \
              --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
              --out "signed/$apk" "candidate/$apk"
            "$apksigner" verify --verbose --print-certs "signed/$apk" > "$signing_dir/certificate.txt"
            actual_cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$signing_dir/certificate.txt")
            if [ "$actual_cert" != "$expected_cert" ]; then
              echo "Signing certificate mismatch: $apk" >&2
              exit 1
            fi
          done
          cp candidate/SOURCE_COMMIT signed/SOURCE_COMMIT
          cd signed
          sha256sum *-release.apk > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xudian-android-release-${{ github.sha }}
          path: |
            signed/*-release.apk
            signed/SHA256SUMS
            signed/SOURCE_COMMIT
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: xudian-android-release-${{ github.sha }}
          path: apk
      - name: Publish app release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_flags=(--latest)
          notes_flags=(--generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
            notes_flags+=(--notes '测试版：与正式发布共用固定签名；历史临时签名安装无法保证直接覆盖，请先备份数据，签名不匹配时不要直接卸载现有应用。正式版更新检查不会推荐此版本。真机性能仍待验证。')
          fi
          if [ -f "docs/releases/$RELEASE_TAG.md" ]; then
            notes_flags=(--generate-notes --notes-file "docs/releases/$RELEASE_TAG.md")
          fi
          gh release create "$RELEASE_TAG" apk/*-release.apk apk/SHA256SUMS apk/SOURCE_COMMIT \
            --verify-tag --title "序点 $RELEASE_TAG" "${notes_flags[@]}" "${release_flags[@]}"
