name: Android checks and release APKs

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflow configuration
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes=
          .github/workflows/*.yml packages/catalog/.github/workflows/*.yml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        working-directory: client
        run: flutter pub get --enforce-lockfile
      - name: Validate app release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/validate_app_release.py "$RELEASE_TAG"
      - name: Prepare stable signing
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for credential in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!credential}" ]; then
              echo "Missing stable Android signing secret: $credential" >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/xudian-release.jks"
      - name: Check production architecture and Python tooling
        run: |
          python3 scripts/check_repository.py
          python3 scripts/module_host/check_architecture.py
          python3 -m unittest discover -s scripts/tests -v
          python3 -m unittest discover -s scripts/module_catalog -p 'test_*.py' -v
          python3 scripts/module_catalog/catalog.py packages/catalog/catalog.json --index-dir module-index --package-dir releases/modules
          python3 scripts/module_host/build_packages.py
      - name: Analyze Flutter client
        working-directory: client
        run: flutter analyze --no-pub
      - name: Run Flutter regression tests
        working-directory: client
        run: flutter test --no-pub --concurrency=2 --reporter expanded
      - name: Build release APKs for all supported Android ABIs
        working-directory: client
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          XUDIAN_KEYSTORE_PATH: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && format('{0}/xudian-release.jks', runner.temp) || '' }}
          XUDIAN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          XUDIAN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          XUDIAN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi --build-number="$((BUILD_NUMBER + 100))" --no-pub
      - name: Record APK checksums and source revision
        working-directory: client/build/app/outputs/flutter-apk
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          sha256sum *-release.apk > SHA256SUMS
          printf '%s\n' "$SOURCE_COMMIT" > SOURCE_COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: xudian-android-release-${{ github.sha }}
          path: |
            client/build/app/outputs/flutter-apk/*-release.apk
            client/build/app/outputs/flutter-apk/SHA256SUMS
            client/build/app/outputs/flutter-apk/SOURCE_COMMIT
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xudian-android-release-${{ github.sha }}
          path: apk
      - name: Publish app release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_flags=(--latest)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags=(--prerelease --latest=false --notes '测试版：包含日程界面、任务动画和运行时优化。使用 CI 开发签名，不保证能覆盖已有安装；安装前请备份数据，签名不匹配时不要直接卸载现有应用。正式版更新检查不会推荐此版本。真机性能仍待验证。')
          fi
          gh release create "$RELEASE_TAG" apk/*-release.apk apk/SHA256SUMS apk/SOURCE_COMMIT \
            --verify-tag --title "序点 $RELEASE_TAG" --generate-notes "${release_flags[@]}"
