<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>设计稿预览</title>
<style>
* { box-sizing:border-box }
[hidden] { display:none !important }
body { margin:0; color:#24282e; background:#f8f8f6; font:16px/1.5 "Source Sans 3",system-ui,sans-serif }
button,select { font:inherit; color:inherit }
button { cursor:pointer }
a { color:inherit }
:focus-visible { outline:3px solid #929def; outline-offset:2px }
.icon { display:block; width:1.25em; height:1.25em; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none }
header { height:72px; border-bottom:1px solid #dcdfe0; background:white; display:flex; gap:14px; align-items:center; padding:0 clamp(20px,3.3vw,48px); font-size:21px; font-weight:600 }
.brand { display:grid; place-items:center; background:#484e86; border-radius:8px; width:32px; height:32px; color:white }
.brand .icon { width:23px }
#library { max-width:1204px; margin:0 auto; padding:58px 32px }
h1 { font-size:clamp(32px,3.3vw,48px); line-height:1.12; margin:0; letter-spacing:-.035em }
#round { margin-bottom:38px; padding:20px 24px; border:1px solid #d7d9e5; border-radius:15px; background:#f1f2f8 }
.round-head { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px }
.round-head small { font-size:14px; color:#545c85 }
.round-head h2 { font-size:24px; margin:2px 0 }
#round-progress { color:#565d69; font-size:14px }
.round-actions { display:flex; flex-wrap:wrap; align-items:center; gap:8px }
.round-button { text-decoration:none; padding:9px 15px; border:1px solid #ccd0dc; border-radius:9px; background:white; font:inherit }
.round-button.primary { background:#484e86; border-color:#484e86; color:white }
#round details { margin-top:14px; font-size:15px }
#round summary { cursor:pointer; width:fit-content; color:#494f77 }
#round-list { padding-left:30px; margin-bottom:0 }
#round-list a { display:inline-block; padding:4px 0; text-underline-offset:3px }
.comment-count { margin-left:12px; color:#62677a; font-size:13px }
#handoff { margin:8px 0 0; color:#565d69; font-size:14px }
#persistence-note { font-size:13px; color:#71472e }
.overview { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin:0 0 26px; color:#565d69 }
#module { background:white; margin-left:12px; width:186px; border:1px solid #dcdfe0; border-radius:8px; min-height:46px; padding:5px 12px }
.table-head,.category-row { display:grid; grid-template-columns:minmax(180px,34%) minmax(130px,1fr) 75px 28px; gap:16px; align-items:center; padding:0 16px }
.table-head { height:48px; color:#565d69; font-size:14px; border-bottom:1px solid #ccd0d2 }
.category-row { text-decoration:none; min-height:73px; border-bottom:1px solid #dcdfe0 }
.category-row:hover,.category-row:focus-visible { background:#eeefed }
.category-title { display:flex; gap:20px; align-items:center; font-size:22px; font-weight:600 }
.category-icon { width:42px; height:42px; display:grid; place-items:center; border-radius:10px }
.category-icon .icon { width:24px; height:24px }
[data-key=tasks] .category-icon {color:#474f83;background:#e4e7f5}
[data-key=course] .category-icon {color:#426965;background:#e3edec}
[data-key=projects] .category-icon {color:#785c37;background:#f4e9db}
[data-key=modules] .category-icon {color:#59567e;background:#e8e7f3}
[data-key=ai] .category-icon {color:#735779;background:#eee5f0}
[data-key=settings] .category-icon {color:#4d6178;background:#e4eaf0}
[data-key=common] .category-icon {color:#586446;background:#e7e9e2}
.owners { color:#565d69 }
.total { text-align:center; font-variant-numeric:tabular-nums }
.category-row > .icon { color:#656b77; width:15px; margin:auto }
#catalog { padding:1rem; max-width:76rem; margin:auto }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(12rem,1fr)); gap:.8rem }
.card img { display:block; width:100%; height:15rem; object-fit:contain }
#viewer { position:fixed; inset:0; display:flex; height:100dvh; overflow:hidden; background:#303239; color:#292d35; font-size:14px; --side-min:clamp(210px,17vw,280px) }
body.viewing { overflow:hidden }
#viewer.reviewing.comments-left { flex-direction:row-reverse }
#canvas { flex:0 1 auto; min-width:0; overflow:hidden }
#stage { height:100%; display:flex; align-items:center; justify-content:flex-start; gap:2px; isolation:isolate }
.tile { --ratio:.45; position:relative; flex:0 1 auto; min-width:0; width:calc(100dvh * var(--ratio)); aspect-ratio:var(--ratio); max-height:100%; border:0; padding:0; background:transparent; cursor:zoom-in }
.image-layer,.tile img { display:block; width:100%; height:100% }
.image-layer { position:relative }
.tile img { object-fit:contain; pointer-events:none }
.tile[aria-pressed=true] { z-index:1 }
#stage:has(.tile + .tile) .tile[aria-pressed=true]::after { content:''; position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 0 2px #8e99d2 }
.tile.zoomed { z-index:2 }
.tile.zoomed .image-layer { transform:scale(var(--scale)); transform-origin:var(--ox) var(--oy); box-shadow:0 2px 15px #171a2090 }
#viewer.pinning .tile { cursor:crosshair }
.figure-label { position:absolute; bottom:4px; left:4px; z-index:2; pointer-events:none; border-radius:3px; padding:0 4px; font:600 11px/18px system-ui,sans-serif; color:#fff; background:#474c5cd9 }
.tile[aria-pressed=true] .figure-label { background:#484e86ed }
.pin { position:absolute; z-index:1; pointer-events:none; transform:translate(-50%,-50%); color:#fff; background:#484e86; border-radius:5px; padding:1px 4px; font:600 12px/17px system-ui,sans-serif; white-space:nowrap; box-shadow:0 0 0 1px white,0 2px 5px #0006 }
.pin.draft { color:#484e86; background:white; outline:1px dashed currentColor }
#sidebar { flex:1 0 var(--side-min); min-width:0; min-height:0; display:flex; flex-direction:column; background:#f6f6f4; border-inline-start:1px solid #d7d9de; container:tools / inline-size }
.reviewing.comments-left #sidebar { border-inline-start:0; border-inline-end:1px solid #d7d9de }
#comments { flex:1; min-height:0; display:flex; flex-direction:column }
.comment-head { display:flex; align-items:center; flex-wrap:wrap; gap:4px 10px; padding:10px 12px 6px }
.comment-head strong { margin-right:auto; font-size:16px }
#move-comments,#toggle-comments { border:0; background:transparent; color:#4e567d; font-size:12px; padding:4px }
#comment-scope { display:flex; gap:4px; flex:none; padding:0 12px 8px; border-bottom:1px solid #dbdde2 }
#comment-scope button,.step button { background:transparent; border:0; border-radius:5px; padding:4px 8px; font-size:12px }
#comment-scope button[aria-pressed=true],.step button[aria-pressed=true] { background:#e2e5f2; color:#3f477a; font-weight:600 }
#thread-body { flex:1; min-height:0; overflow:auto; scrollbar-gutter:stable; overscroll-behavior:contain; scrollbar-width:thin; padding:0 10px 8px }
.thread-group { padding:8px 0 }
.thread-group + .thread-group { border-top:1px solid #e0e1e4 }
.group-title { display:inline-flex; align-items:baseline; gap:6px; border:0; background:transparent; padding:0; text-align:left; font-size:13px; line-height:1.4; color:#484d58 }
.figure-number { flex:none; padding:0 4px; border-radius:3px; font-size:11px; background:#e3e4e8; color:#4f5564 }
.group-title[aria-current=true] .figure-number { background:#515887; color:white }
.picture-thread { display:grid; gap:3px; list-style:none; padding:0; margin:4px 0 }
.picture-thread:empty { display:none }
.picture-thread li { display:flex; align-items:baseline; gap:7px; border:1px solid #dadce2; border-radius:4px; background:#fff; padding:3px 5px 3px 7px; line-height:1.45; font-size:14px }
.comment-num { flex:none; white-space:nowrap; font-weight:600; font-size:13px; color:#485180 }
.comment-text { flex:1; white-space:pre-wrap; overflow-wrap:anywhere; min-width:0 }
.remove-comment { flex:none; padding:0; width:20px; height:20px; font:16px/1 sans-serif; color:#6d7280; border:0; background:none; border-radius:3px }
.remove-comment:hover { background:#f6e9e7; color:#933e34 }
.comment-form { display:flex; align-items:center; gap:3px; margin:4px 0 0; padding:2px 3px 2px 7px; border:1px solid #d1d4de; border-radius:5px; background:white }
.comment-form:focus-within { border-color:#6973a3 }
.comment-input { flex:1; min-width:0; field-sizing:content; min-height:20px; max-height:90px; overflow:auto; resize:none; border:0; outline:none; padding:0; background:transparent; color:inherit; font:inherit; font-size:13px; line-height:20px }
.place-pin,.send-comment { flex:none; width:26px; height:24px; display:grid; place-items:center; border:0; border-radius:4px; padding:0; background:transparent; color:#5d6685 }
.place-pin .icon,.send-comment .icon { width:15px; height:15px }
.place-pin[aria-pressed=true],.place-pin.has-point { background:#e6e8f6; color:#343d7a }
.send-comment { color:white; background:#4c548b }
.send-comment:disabled { color:#848894; background:#ececf0; cursor:default }
#catalog-details { padding:18px 14px; color:#606673; font-size:13px; overflow:auto }
#catalog-details h1 { margin-top:4px; color:#303543; font-size:20px; letter-spacing:0 }
#controls { flex:none; margin-top:auto; display:grid; gap:7px; border-top:1px solid #cfd1d9; background:#fff; padding:8px 10px; max-height:55dvh; overflow:auto }
.control-info,.browse-actions,.copy-actions,.step { display:flex; align-items:center; gap:4px; min-width:0 }
.control-info { gap:6px; color:#5c6270; font-size:12px }
#state { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#444d7e; text-underline-offset:2px }
#count { margin-left:auto; font-size:12px; white-space:nowrap; font-variant-numeric:tabular-nums }
#scale:empty,#review:empty { display:none }
.tool { display:inline-flex; justify-content:center; align-items:center; gap:4px; padding:4px 7px; min-height:29px; border:1px solid #d5d7df; border-radius:5px; font-size:12px; background:#fff; color:#404655; white-space:nowrap }
.tool:hover:not(:disabled) { background:#f1f2f8; border-color:#c4c8dc }
.tool:disabled { opacity:.45; cursor:default }
.tool .icon { width:14px; height:14px }
#back { border:0; padding:0 2px; min-height:22px }
.browse-actions { flex-wrap:wrap }
.step { margin-left:auto; padding:1px; gap:1px; border:1px solid #dddfe4; border-radius:6px }
.copy-actions { flex-wrap:wrap }
.copy.done { background:#edf5ef; color:#315849 }
#viewer:has(#comments.collapsed:not([hidden])) #sidebar { flex:0 0 60px }
#viewer:has(#comments.collapsed:not([hidden])) #canvas { flex:1 }
.collapsed #thread-heading,.collapsed #move-comments,.collapsed #comment-scope { display:none }
.collapsed .comment-head { justify-content:center }
.sr-only { position:absolute; width:1px; height:1px; clip-path:inset(50%); overflow:hidden; white-space:nowrap }
@media (max-width:720px) {
  #viewer { --side-min:clamp(140px,40vw,205px) }
  #library { padding:26px 16px }
  .overview { margin:12px 0 18px }
  .table-head,.category-row { grid-template-columns:minmax(0,1fr) auto 16px; gap:8px; padding:0 5px }
  .category-title { font-size:18px; gap:10px }
  .owners { display:none }
}
@container tools (max-width:235px) {
  .comment-head { gap:2px; padding:6px }
  .comment-head strong { font-size:14px }
  #thread-body { padding:0 5px 6px; scrollbar-gutter:auto }
  #comment-scope { padding:0 5px 5px }
  #comment-scope button,.step button { padding:3px 5px }
  #controls { gap:4px; padding:5px }
  .tool { padding:4px; gap:2px }
  .copy-actions .tool span,.turn-button span { display:none }
  .copy-actions .tool,.turn-button { min-width:26px }
}
@container tools (max-width:75px) {
  #controls { max-height:75dvh }
  .control-info,.browse-actions,.copy-actions { flex-wrap:wrap; justify-content:center; gap:2px }
  .control-info #state,.control-info #review,#back span { display:none }
  #count,.step { margin:0 }
  .step { flex-direction:column }
  .collapsed .comment-head { padding:4px 0 }
  #toggle-comments { padding:5px 2px }
}
</style>
</head>
<body>
<svg aria-hidden="true" width="0" height="0" style="position:absolute">
<defs>
<symbol id="i-back" viewBox="0 0 24 24"><path d="m14.5 5-7 7 7 7"/></symbol>
<symbol id="i-next" viewBox="0 0 24 24"><path d="m9.5 5 7 7-7 7"/></symbol>
<symbol id="i-brand" viewBox="0 0 24 24"><rect x="3" y="3" width="13" height="13" rx="2"/><rect x="8" y="8" width="13" height="13" rx="2" fill="#484e86"/></symbol>
<symbol id="i-tasks" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="17" rx="3"/><path d="M7 2v5m10-5v5M2 10h20M8 15l3 3 5-6"/></symbol>
<symbol id="i-course" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M8 3v18M2 9h20M8 15h14m-7-6v12"/></symbol>
<symbol id="i-projects" viewBox="0 0 24 24"><path d="M2 8V5h7l3 3h10v12H2V8h10m-4 6h8"/></symbol>
<symbol id="i-modules" viewBox="0 0 24 24"><path d="M2 2h8v8H2zm12 0h8v8h-8zM2 14h8v8H2zm12 0h8v8h-8z"/></symbol>
<symbol id="i-ai" viewBox="0 0 24 24"><path d="m10 4 2 6 6 2-6 2-2 7-2-7-6-2 6-2zm9-3 1 3 3 1-3 1-1 3-1-3-3-1 3-1z"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="M5 2v4m0 5v11m7-20v12m0 5v3m7-20v5m0 5v10"/><path d="M3 6h4v5H3zm7 8h4v5h-4zm7-7h4v5h-4z"/></symbol>
<symbol id="i-common" viewBox="0 0 24 24"><path d="m2 8 10-5 10 5-10 5zm0 5 10 5 10-5M2 17l10 5 10-5"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M5 2h9l5 5v15H5zm9 0v6h5"/></symbol>
<symbol id="i-reference" viewBox="0 0 24 24"><path d="m7 6-6 6 6 6m10-12 6 6-6 6m-4-15-3 18"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 1v4m0 14v4M1 12h4m14 0h4"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="m3 11 17-7-6 16-3-7-8-2zm8 2 9-9"/></symbol>
<symbol id="i-comment" viewBox="0 0 24 24"><path d="M4 4h16v12H9l-5 4V4zM8 8h8m-8 4h5"/></symbol>
</defs></svg>
<main id="home" hidden>
<header><span class="brand"><svg class="icon" aria-hidden="true"><use href="#i-brand"/></svg></span>设计稿预览</header>
<div id="library">
<section id="round" hidden aria-labelledby="round-name">
<div class="round-head"><div><small>本轮审核</small><h2 id="round-name"></h2><span id="round-progress" role="status"></span></div>
<div class="round-actions"><a class="round-button primary" id="start-round" data-key="current-review" href="#current-review">开始审核</a><button class="round-button" id="copy-round">复制本轮评论</button><button class="round-button" id="save-round">保存评论文件</button></div></div>
<p id="handoff" role="status">可复制评论回到对话，或将评论文件保存到看图目录。</p><details><summary>本轮图稿</summary><ol id="round-list"></ol></details>
<p id="persistence-note" hidden>当前浏览器仅能在本次打开期间保留评论。关闭前可复制评论或保存评论文件。</p>
</section>
<h1>按功能浏览</h1>
<div class="overview"><span id="summary" aria-live="polite"></span><label>所属模块<select id="module"><option value="">全部模块</option>$modules</select></label></div>
<div class="table-head" aria-hidden="true"><span>功能分类</span><span class="owners">所属模块</span><span class="total">图稿</span></div>
<nav id="rows" aria-label="功能分类"></nav>
<template id="row-template"><a class="category-row"><span class="category-title"><span class="category-icon"><svg class="icon" aria-hidden="true"><use/></svg></span><span class="name"></span></span><span class="owners"></span><span class="total"></span><svg class="icon" aria-hidden="true"><use href="#i-next"/></svg></a></template>
</div></main>
<main id="viewer" hidden aria-label="图稿浏览">
<div id="canvas"><div id="stage" aria-label="当前目录的图片"></div></div>
<aside id="sidebar" aria-label="图稿侧栏">
<div id="catalog-details" hidden><span id="category-name"></span> · <span id="owner-name"></span><h1 id="page-name"></h1></div>
<section id="comments" hidden aria-label="图片评论">
<div class="comment-head"><strong id="thread-heading">图片评论</strong><button id="move-comments">移到左侧</button><button id="toggle-comments" aria-expanded="true" aria-controls="thread-body">收起</button></div>
<div id="comment-scope" role="group" aria-label="评论范围"><button data-scope="visible" aria-pressed="true">同屏图片</button><button data-scope="round" aria-pressed="false">本轮全部</button></div>
<div id="thread-body"></div>
<template id="picture-thread-template"><section class="thread-group">
<button class="group-title" type="button"><span class="figure-number"></span><strong></strong></button><ol class="picture-thread"></ol>
<form class="comment-form"><textarea class="comment-input" rows="1"></textarea>
<button class="place-pin" type="button" aria-pressed="false" aria-label="标注位置" title="标注位置"><svg class="icon" aria-hidden="true"><use href="#i-pin"/></svg></button><button class="send-comment" aria-label="发表评论" title="发表评论" disabled><svg class="icon" aria-hidden="true"><use href="#i-send"/></svg></button></form></section></template>
</section>
<footer id="controls" aria-label="图稿操作">
<div class="control-info"><button id="back" class="tool" title="返回分类列表" aria-label="返回分类列表"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg><span>分类列表</span></button>
<a id="state" target="_blank" rel="noopener" title="打开原图"></a><span id="review"></span><span id="scale"></span><span id="count"></span></div>
<div class="browse-actions"><button id="prev" class="tool turn-button" aria-label="上一张"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg><span id="prev-label">上一张</span></button>
<button id="next" class="tool turn-button" aria-label="下一张"><span id="next-label">下一张</span><svg class="icon" aria-hidden="true"><use href="#i-next"/></svg></button>
<div class="step" role="group" aria-label="每次翻页张数"><button data-step="1" aria-pressed="true">1 张</button><button data-step="3" aria-pressed="false">3 张</button></div></div>
<div class="copy-actions" role="group" aria-label="复制">
<button class="tool copy" data-copy="file" title="复制文件名" aria-label="复制文件名"><svg class="icon" aria-hidden="true"><use href="#i-file"/></svg><span>文件名</span></button>
<button class="tool copy" data-copy="path" title="复制原图路径" aria-label="复制原图路径"><svg class="icon" aria-hidden="true"><use href="#i-projects"/></svg><span>原图路径</span></button>
<button class="tool copy" data-copy="reference" title="复制 Codex 定位" aria-label="复制 Codex 定位"><svg class="icon" aria-hidden="true"><use href="#i-reference"/></svg><span>Codex 定位</span></button>
<button class="tool copy" data-copy="comments" title="复制本轮评论" aria-label="复制本轮评论"><svg class="icon" aria-hidden="true"><use href="#i-comment"/></svg><span>本轮评论</span></button></div>
</footer>
</aside><span id="announce" class="sr-only" role="status"></span></main>
<main id="catalog"><h1>设计稿目录</h1>$sections</main>
<script id="replaced-revisions" type="application/json">$replaced_revisions</script>
<script id="current-round" type="application/json">$current_review</script>
<script>
$viewer_script
</script>
</body></html>
